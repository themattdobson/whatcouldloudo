<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-sA+e2E2i24z5z6E2bo6EdDHwgdQq7fxtfGAE0LlvR8I="
  crossorigin=""
/>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Leaflet JS -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-DqqJmnwXQF5ZtPcOOo4loiI5DQc6/HEz4g1DYP4y1nU="
  crossorigin=""
></script>
<script>
  // Initialize the map
  const map = L.map('map').setView([38.235, -85.716], 13); // Centered roughly on Louisville

  // Add the OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);

  // Add a sample marker
  L.marker([38.235, -85.716])
    .addTo(map)
    .bindPopup('Hello from Louisville!')
    .openPopup();
</script>

<div id="map" style="height: 500px; width: 100%; margin-top: 2rem;"></div>

  </body>
</html>
